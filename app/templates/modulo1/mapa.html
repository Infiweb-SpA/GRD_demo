<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Público - GRD Comunal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .leaflet-control { border-radius: 8px; }
    </style>
</head>
<body class="h-screen">
    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel de Control -->
    <div class="absolute top-4 left-4 z-[1000] bg-white rounded-lg shadow-lg p-4 w-80">
        <h3 class="font-bold text-lg mb-3 text-gray-800">Capas del Mapa</h3>

        <!-- Capas conmutables -->
        <div class="space-y-3">
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="zonasRiesgo" checked class="rounded">
                <span class="text-sm">Zonas de Riesgo</span>
            </label>

            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="estacionesFluviales" checked class="rounded">
                <span class="text-sm">Estaciones Fluviales</span>
            </label>

            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="incidentes" checked class="rounded">
                <span class="text-sm">Incidentes Históricos</span>
            </label>
        </div>

         <!-- Leyenda -->
        <div class="mt-4 pt-3 border-t border-gray-200">
            <h4 class="font-semibold text-sm mb-2">Leyenda</h4>
            <div class="space-y-1 text-xs">
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 bg-red-500 rounded"></div>
                    <span>Zona de Riesgo Alto</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 bg-orange-500 rounded"></div>
                    <span>Zona de Riesgo Moderado</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 bg-blue-500 rounded-full"></div>
                    <span>Estación Fluvial</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 bg-purple-500 rounded-full"></div>
                    <span>Incidente Reportado</span>
                </div>
            </div>
        </div>

        <!-- Botón de exportación (bloqueado en público) -->
        <button disabled
                class="mt-4 w-full bg-gray-300 text-gray-500 px-3 py-2 rounded text-sm cursor-not-allowed">
            🔒 Exportar Datos (Solo Funcionarios)
        </button>
    </div>

        <script>
        // ============================================================
        //  Mapa base
        // ============================================================
        const map = L.map('map').setView([-38.9, -72.3], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // ============================================================
        //  Grupos de capas
        // ============================================================
        const capaZonas      = L.layerGroup().addTo(map);
        const capaEstaciones = L.layerGroup().addTo(map);
        const capaIncidentes = L.layerGroup().addTo(map);

        // ============================================================
        //  Colores oficiales por severidad (Módulo 3)
        // ============================================================
        const COLORES_SEV = {
            bajo:    '#10b981',
            medio:   '#f59e0b',
            alto:    '#f97316',
            critico: '#dc2626',
        };

        // ============================================================
        //  Módulo 3: zonas de riesgo (endpoint público saneado)
        // ============================================================
        async function cargarZonasRiesgo() {
            try {
                const response = await fetch('/api/modulo1/zonas-riesgo-publicas');
                if (!response.ok) throw new Error('Error de red');
                const geojson = await response.json();
                renderizarZonasRiesgo(geojson);
            } catch (error) {
                console.error('Error cargando zonas de riesgo:', error);
            }
        }

        function renderizarZonasRiesgo(geojson) {
            if (!geojson || !geojson.features) return;

            L.geoJSON(geojson, {
                style: (feature) => {
                    const sev = feature.properties?.severidad || 'medio';
                    const color = COLORES_SEV[sev] || '#6b7280';
                    return {
                        color: color,
                        weight: 2,
                        fillColor: color,
                        fillOpacity: 0.3,
                    };
                },
                onEachFeature: (feature, layer) => {
                    const p = feature.properties || {};
                    const sev = p.severidad || 'medio';
                    const color = COLORES_SEV[sev] || '#6b7280';

                    layer.bindPopup(`
                        <div style="min-width:220px">
                            <b style="color:${color};font-size:14px">${p.nombre}</b><br>
                            <span style="display:inline-block;background:${color};color:white;
                                         padding:2px 8px;border-radius:999px;font-size:11px;
                                         font-weight:600;margin-top:4px">
                                ${sev.toUpperCase()}
                            </span>
                            <div style="margin-top:8px;font-size:12px;color:#374151">
                                ${p.motivo || 'Zona consolidada por análisis empírico.'}
                            </div>
                            <div style="margin-top:6px;font-size:11px;color:#9ca3af">
                                Comuna: ${p.comuna}
                            </div>
                        </div>
                    `);
                },
            }).addTo(capaZonas);
        }

        // ============================================================
        //  Módulo 2: incidentes
        // ============================================================
        async function cargarIncidentes() {
            try {
                const response = await fetch('/api/modulo1/incidentes-publicos');
                if (!response.ok) throw new Error('Error de red');
                const geojson = await response.json();
                renderizarIncidentes(geojson);
            } catch (error) {
                console.error('Error cargando incidentes:', error);
            }
        }

        function renderizarIncidentes(geojson) {
            if (!geojson || !geojson.features) return;

            L.geoJSON(geojson, {
                pointToLayer: (feature, latlng) =>
                    L.circleMarker(latlng, {
                        radius: 8,
                        color: '#7c3aed',
                        weight: 2,
                        fillColor: '#a78bfa',
                        fillOpacity: 0.85,
                    }),
                style: {
                    color: '#7c3aed',
                    weight: 3,
                    fillColor: '#a78bfa',
                    fillOpacity: 0.3,
                },
                onEachFeature: (feature, layer) => {
                    const p = feature.properties || {};
                    const fecha = p.fecha_creacion
                        ? new Date(p.fecha_creacion).toLocaleString('es-CL')
                        : 'Fecha desconocida';
                    layer.bindPopup(`
                        <div style="min-width:200px">
                            <b style="color:#7c3aed;font-size:14px">${p.amenaza_tipo}</b><br>
                            <div style="margin-top:4px;font-size:13px;color:#374151">
                                ${p.comentario || '<i>Sin comentario</i>'}
                            </div>
                            <div style="margin-top:6px;font-size:11px;color:#9ca3af">
                                Reportado el ${fecha}
                            </div>
                        </div>
                    `);
                },
            }).addTo(capaIncidentes);
        }

        // ============================================================
        //  Toggles
        // ============================================================
        function toggleCapa(capa, visible) {
            if (visible) { if (!map.hasLayer(capa)) map.addLayer(capa); }
            else         { if (map.hasLayer(capa)) map.removeLayer(capa); }
        }
        document.getElementById('zonasRiesgo').addEventListener('change', function () {
            toggleCapa(capaZonas, this.checked);
        });
        document.getElementById('estacionesFluviales').addEventListener('change', function () {
            toggleCapa(capaEstaciones, this.checked);
        });
        document.getElementById('incidentes').addEventListener('change', function () {
            toggleCapa(capaIncidentes, this.checked);
        });

        // ============================================================
        //  Init
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            cargarZonasRiesgo();
            cargarIncidentes();
        });
    </script>
</body>
</html>
